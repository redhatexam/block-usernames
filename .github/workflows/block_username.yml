# File: .github/workflows/blocked_username.yml
# This workflow checks the username of the pull request author.
# If the username matches a blocked pattern, it automatically adds a comment
# to the PR and then closes it.
# This workflow's runs will be automatically approved by the 'auto_approve_blocked_username_runs.yml' 
# workflow if pending, triggered by this workflow being requested.

name: Auto-Close PR for Blocked Usernames

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Grant permissions for the GITHUB_TOKEN to write to pull requests (to close them and comment)
permissions:
  pull-requests: write

jobs:
  check_and_close_pr_if_blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check username and close PR if blocked
        # The GitHub CLI (gh) is pre-installed on GitHub-hosted runners.
        # We pass the GITHUB_TOKEN and PR_NUMBER as environment variables for gh.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_USERNAME: ${{ github.event.pull_request.user.login }}
        run: |
          # Define the pattern for usernames that should be blocked.
          # Example: any username containing "redhat"
          blocked_pattern=".*redhat.*" 
          
          echo "Checking PR #${PR_NUMBER} from user: ${AUTHOR_USERNAME}"
          echo "Blocked pattern: '${blocked_pattern}'"

          if [[ "${AUTHOR_USERNAME}" =~ $blocked_pattern ]]; then
            echo "::error::User '${AUTHOR_USERNAME}' matches blocked pattern '${blocked_pattern}'."
            echo "Closing pull request #${PR_NUMBER}."
            
            # Add a comment to the PR explaining why it's being closed
            gh pr comment "${PR_NUMBER}" --body "This pull request has been automatically closed because the author's username ('${AUTHOR_USERNAME}') matches a blocked pattern. If you believe this is an error, please contact a repository administrator."
            
            # Close the pull request
            gh pr close "${PR_NUMBER}"
            
            # Exit with a non-zero status to indicate the workflow took a blocking action and failed the check.
            exit 1 
          else
            echo "Username '${AUTHOR_USERNAME}' is not blocked. PR #${PR_NUMBER} can proceed."
            # Exit with zero status to indicate the check passed.
            exit 0
          fi
---
# File: .github/workflows/auto_approve_blocked_username_runs.yml
# This workflow is triggered when the 'Auto-Close PR for Blocked Usernames' workflow is requested.
# It then uses mheap/automatic-approve-action to approve that specific workflow run if it's pending approval.
# This helps to bypass the manual "approve run" step in the Actions tab more immediately.

name: Automatic Approve Blocked Username Runs # Renamed for clarity

on:
  workflow_run:
    # This targets the 'name' of the workflow defined in blocked_username.yml
    workflows: ["Auto-Close PR for Blocked Usernames"] 
    # Triggers when the target workflow is requested (i.e., a new run is created)
    types: [requested] 

jobs:
  automatic-approve:
    name: Automatic Approve Blocked Username Runs
    runs-on: ubuntu-latest
    steps:
      - name: Automatic Approve
        uses: mheap/automatic-approve-action@v1
        with:
          # IMPORTANT: This Personal Access Token (PAT) must have 'repo' scope 
          # (or 'actions:write' and 'workflow' if using fine-grained PATs).
          # It needs to be created by a user with admin/write access to the repository
          # and stored as a repository secret (e.g., named PAT).
          # The default GITHUB_TOKEN does NOT have permission to approve workflow runs.
          token: ${{ secrets.PAT }}

          # Specify the filename(s) of the workflow(s) whose runs you want to auto-approve.
          # This should still be the filename of your PR-closing workflow.
          workflows: "blocked_username.yml" 

          # Optional: You can add more configurations for the mheap/automatic-approve-action
          # Refer to its documentation: https://github.com/mheap/automatic-approve-action
          # For example, to only approve runs from first-time contributors:
          # first_time_contributor_only: true 
