name: Block Usernames TEST

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  check_username:
    runs-on: ubuntu-latest
    steps:
      - name: Get Pull Request Information
        uses: actions/github-script@v7
        id: get_pr_info
        with:
          script: |
            const creator = context.payload.pull_request.user.login;
            const blockedWords = ['redhat', 'idiot'];
            const isBlocked = blockedWords.some(word => creator.toLowerCase().includes(word));
            core.setOutput('creator', creator);
            core.setOutput('is_blocked', isBlocked);

      - name: Close Pull Request and Comment (if blocked)
        if: steps.get_pr_info.outputs.is_blocked == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const creator = steps.get_pr_info.outputs.creator;
            const issueNumber = context.payload.pull_request.number;
            const message = `Pull request from user "${creator}" has been closed because their username contains a blocked word.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
              state: 'closed'
            });
